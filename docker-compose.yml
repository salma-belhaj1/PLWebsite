services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: peace_love_user
      POSTGRES_PASSWORD: peace_love_password
      POSTGRES_DB: peace_love_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peace_love_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
